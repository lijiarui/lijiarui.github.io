<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>岗位 × 行业，一格一格拓 · 句子互动</title>
<link rel="stylesheet" href="company.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
.slide{transition:none}
</style>
</head>
<body>
<div id="stage">
<section class="slide">
    <div class="head rv">
      <div class="eyebrow">Expansion map — 岗位 × 行业</div>
      <h2>岗位 × 行业，<span class="hl warm">一格一格拓</span>。</h2>
      <div class="sub">同一套 AI 员工基建，岗位横着复制，行业竖着加深：跑通的格子，到你这里就是现成模板。</div>
    </div>
    <div class="body" style="padding-top:14px">
      <div class="mxv2 rv" style="--d:.25s">
        <div class="mg" style="margin-bottom:4px"><span></span><span class="gband" style="grid-column:2/7">对话场景</span><span class="gband" style="grid-column:7/12">跳出对话场景</span></div>
        <div class="mg"><span></span><span class="ch">销售</span><span class="ch">导购</span><span class="ch">客服</span><span class="ch">理财顾问</span><span class="ch">社工调解</span><span class="ch">律师法务</span><span class="ch">HR</span><span class="ch">GEO 优化</span><span class="ch">选品规划</span><span class="ch">后勤管家</span></div>
        <div class="mg"><span class="rh">在线教育</span><span class="pl on" style="--pd:0.50s"><i></i>已跑通</span><span class="pl"></span><span class="pl on" style="--pd:0.59s"><i></i>已跑通</span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl half" style="--pd:0.68s"><i></i>复制中</span><span class="pl"></span><span class="pl"></span><span class="pl"></span></div>
        <div class="mg"><span class="rh">消费电商</span><span class="pl on" style="--pd:0.77s"><i></i>已跑通</span><span class="pl on" style="--pd:0.86s"><i></i>已跑通</span><span class="pl on" style="--pd:0.95s"><i></i>已跑通</span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl half" style="--pd:1.04s"><i></i>复制中</span><span class="pl"></span><span class="pl"></span></div>
        <div class="mg"><span class="rh">金融</span><span class="pl"></span><span class="pl"></span><span class="pl on" style="--pd:1.13s"><i></i>已跑通</span><span class="pl half" style="--pd:1.22s"><i></i>复制中</span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl on" style="--pd:1.31s"><i></i>已跑通</span><span class="pl"></span></div>
        <div class="mg"><span class="rh">政务司法</span><span class="pl"></span><span class="pl"></span><span class="pl half" style="--pd:1.40s"><i></i>复制中</span><span class="pl"></span><span class="pl on" style="--pd:1.49s"><i></i>已跑通</span><span class="pl half" style="--pd:1.58s"><i></i>复制中</span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl"></span></div>
        <div class="mg"><span class="rh">泛互联网</span><span class="pl on" style="--pd:1.67s"><i></i>已跑通</span><span class="pl"></span><span class="pl half" style="--pd:1.76s"><i></i>复制中</span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl on" style="--pd:1.85s"><i></i>已跑通</span><span class="pl"></span><span class="pl"></span><span class="pl"></span></div>
        <div class="mg"><span class="rh">制造业</span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl"></span><span class="pl half" style="--pd:1.94s"><i></i>复制中</span></div>
        <div class="mlegv2">
          <span><i style="background:var(--teal-deep)"></i><b style="color:var(--teal-deep)">已跑通</b>（按结果付费验证）</span>
          <span><i style="background:linear-gradient(90deg,var(--blue) 50%,#fff 50%);border:1px solid var(--blue);box-sizing:border-box"></i><b style="color:var(--blue)">复制中</b></span>
          <span>空白格 · 规划中</span>
        </div>
      </div>
    </div>
    <div class="punch rv" style="--d:2.4s">销售起步，教育 → 消费 → 金融 → 政务陆续覆盖，制造业在拓：你的行业，<b style="color:#5EEAD4">大概率已有跑通的岗位</b>。</div>
  <div class="pbm"><i></i><b>句子互动</b><span class="sep"></span><em>JUZI.BOT</em></div>
  </section>
</div>
<script>
(function(){
  var stage=document.getElementById('stage'),s=document.querySelector('.slide');
  var rvs=s.querySelectorAll('.rv');
  for(var k=0;k<rvs.length;k++){
    if(!rvs[k].style.getPropertyValue('--d'))rvs[k].style.setProperty('--d',(0.05+k*0.06).toFixed(2)+'s');
  }
  /* 嵌在博客里时裁掉页面四周的留白（内容区放大约 10%）；单独打开时显示整页 */
  var embedded=window.self!==window.top;
  var C=embedded?{x:56,y:32,w:1168,h:657}:{x:0,y:0,w:1280,h:720};
  function fit(){
    if(!embedded&&innerHeight>innerWidth*1.2){
      /* 手机竖屏单独打开：横置铺满，字比不旋转大近一倍 */
      var r=Math.min(innerHeight/1280,innerWidth/720);
      stage.style.transform='translate('+((innerWidth+720*r)/2)+'px,'+((innerHeight-1280*r)/2)+'px) rotate(90deg) scale('+r+')';
      return;
    }
    var k=Math.min(innerWidth/C.w,innerHeight/C.h);
    stage.style.transform='translate('+((innerWidth-C.w*k)/2-C.x*k)+'px,'+((innerHeight-C.h*k)/2-C.y*k)+'px) scale('+k+')';
  }
  addEventListener('resize',fit);fit();
  /* 露出 35% 才播放，完全滚出视野才复位：每次滚到都重播，边缘不闪 */
  var called=false;
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){
      called=true;
      var e=es[es.length-1];
      if(e.intersectionRatio>=.35)s.classList.add('active');
      else if(!e.isIntersecting)s.classList.remove('active');
    },{threshold:[0,.35]}).observe(document.body);
    setTimeout(function(){if(!called)s.classList.add('active');},2500);
  }else s.classList.add('active');
})();
</script>
</body>
</html>
